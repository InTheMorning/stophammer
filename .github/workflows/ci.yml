name: CI

on:
  push:
    branches: [main]
    # A push that changes only documents starts no run. The ADR index and
    # AGENTS.md stay in, because tests/adr0045_governance_guards_tests.rs
    # reads them. A later pattern overrides an earlier one.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/adr/**'
      - 'AGENTS.md'
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.93.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt -- --check
