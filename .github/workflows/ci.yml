name: CI

on:
  push:
    branches: [main]
    # A push that changes only documents starts no run. The ADR index and
    # AGENTS.md stay in, because tests/adr0045_governance_guards_tests.rs
    # reads them. A later pattern overrides an earlier one.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/adr/**'
      - 'AGENTS.md'
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.93.1

# Each job gets a read-only token unless it states more.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

      # deny.toml gives the advisory policy. A new RustSec advisory for a
      # crate in Cargo.lock stops the run.
      - name: Advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
